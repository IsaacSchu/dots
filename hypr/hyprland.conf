#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XDG_CONFIG_HOME,$HOME/.config
env = __GL_GSYNC_ALLOWED,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = WLR_EGL_NO_MODIFIERS,1
env = XDG_CACHE_HOME,$HOME/.cache
env = XDG_DATA_HOME,$HOME/.local/share
env = CARGO_HOME,$XDG_DATA_HOME/cargo
env = NPM_CONFIG_USERCONFIG,$XDG_CONFIG_HOME/npm/npmrc
env = W3M_DIR,$XDG_STATE_HOME/w3m
env = CUDA_CACHE_PATH,$XDG_CACHE_HOME/nv
env = WINEPREFIX,$XDG_DATA_HOME/wineprefixes/default
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = PARALLEL_HOME,$XDG_CONFIG_HOME/parallel
env = _JAVA_OPTIONS,-Djava.util.prefs.userRoot=$XDG_CONFIG_HOME/java
env = GTK_THEME,Adwaita:dark
env = QT_STYLE,Breeze-dark
env = QT_STYLE_OVERRIDE,kvantum
env = QT_QPA_PLATFORMTHEME,qt5ct
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = __GL_VRR_ALLOWED,1
env = GBM_BACKEND,nvidia-drm
env = WLR_NO_HARDWARE_CURSORS,1
env = MOZ_ENABLE_WAYLAND,1
cursor {
    no_hardware_cursors = 1
    }

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 1
    gaps_out = 0,0,0,0
    border_size = 0

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(440099AA) rgba(440099AA) 45deg
    col.inactive_border = rgba(000000D0)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0
    # Change transparency of focused and unfocused windows
    active_opacity = 1
    inactive_opacity = .9
    shadow{
        enabled = 1
        range = 2
        render_power = 1
        color = rgba(00000099)

        }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = 1
        size = 3
        passes = 2
        ignore_opacity = true
        new_optimizations = true
#        vibrancy = 0.1
        xray = 1
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = 1
#    bezier = myBezier, 0.05, 0.9, 0.1, 1.0
    bezier = myBezier, 0.25, 1.0, 0.5, 1.0
    animation = global, 1, 1, myBezier
    animation = windows, 1, 1, myBezier, popin 90%
    animation = windowsOut, 1, 1, myBezier, popin 90%
    animation = windowsMove, 1,1, myBezier, popin 90%
    animation = layersIn, 1, 1, myBezier, fade
    animation = layersOut, 1, 1, myBezier, fade
#    animation = fadeIn, 0,1,default
#    animation = fadeOut, 0,1,default
#    animation = fadeSwitch, 0,0,default
#    animation = fadeShadow, 0,0,default
#    animation = fadeDim, 0,1,default
    animation = border, 0, 1, myBezier 
    animation = borderangle, 1, 1, myBezier
    animation = fade, 1, 1, myBezier 
    animation = workspaces, 0, 1, myBezier, fade
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
#master {
#    new_status = master
#}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_splash_rendering = true
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    new_window_takes_over_fullscreen = 2
    background_color = 0x000000
    vrr = 0
    vfr = 1
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
#    kb_variant =
#    kb_model =
     kb_options = caps:escape
#    kb_rules =

    follow_mouse = 1
    accel_profile = flat
    sensitivity =  -.7 # -1.0 - 1.0, 0 means no modification.
    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = ALT # Sets "Windows" key as main modifier
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, alacritty
bind = $mainMod, q, killactive,
bind = $mainMod SHIFT, F, fullscreen,
bind = $mainMod SHIFT, p, exit,
bind = $mainMod, F, exec, librewolf
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, w, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r

bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, S
bind = $mainMod SHIFT, S, movetoworkspace, special:S

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm =,  mouse:275, movewindow
#bindm =, mouse:276, resizewindow

#bind = $mainMod, Tab, focuscurrentorlast

bind = $mainMod, n, exec, hyprshot -m region 
bind = , code:172, exec, playerctl play-pause
bind = , code:123, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , code:122, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , code:121, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = $mainMod, m, exec,  [float] mpv --force-window --idle --no-fullscreen --geometry=1280x720

bind = $mainMod, c, exec,  [float] ghostty
bind = $mainMod SHIFT, Return, exec,  [float] ghostty


#bind = , XF86AudioPlay, exec, playerctl play
#bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPlayPause, exec, playerctl play-pause

bind = $mainMod, b, exec, bash /home/lain/bin/scripts/togglebar.sh
bind = $mainMod, G, exec, bash /home/lain/bin/scripts/gaps.sh
bind = $mainMod SHIFT, G, exec, bash /home/lain/bin/scripts/gamemode.sh 
#bind = $mainMod+Shift, a, exec, firefox -new-window chat.deepseek.com; sleep 0.15; hyprctl dispatch focuswindow "Firefox"; hyprctl dispatch togglefloating; hyprctl dispatch resizeactive exact 1200 675; hyprctl dispatch centerwindow
bind = $mainMod, a, exec, librewolf -bin -new-window chatgpt.com; sleep 0.15; hyprctl dispatch focuswindow "LibreWolf"; hyprctl dispatch togglefloating; hyprctl dispatch resizeactive exact 1200 675; hyprctl dispatch centerwindow
bind = $mainMod+Shift, a, exec, librewolf -new-window chatgpt.com
bind = $mainMod, y, exec, firefox -new-window youtube.com; sleep 0.15; hyprctl dispatch focuswindow "Firefox"; hyprctl dispatch togglefloating; hyprctl dispatch resizeactive exact 1200 675; hyprctl dispatch centerwindow
bind = $mainMod+Shift, C, exec, hyprctl dispatch togglefloating && hyprctl dispatch resizeactive exact 1200 675 && hyprctl dispatch centerwindow
